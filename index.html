<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <meta name="theme-color" content="#050510">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Tech+ PWA Flashcards</title>
    <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23050510' stroke='%23d946ef' stroke-width='4'/><text x='50' y='68' font-size='50' text-anchor='middle' fill='%2306b6d4' font-family='sans-serif' font-weight='bold'>T+</text></svg>">
    
    <style>
        :root {
            --neon-pink: #d946ef;
            --neon-purple: #a855f7;
            --neon-cyan: #06b6d4;
            --neon-blue: #3b82f6;
            --bg-color: #050510;
            --card-bg: rgba(20, 20, 40, 0.6);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            box-sizing: border-box;
            user-select: none; /* Mobile app feel */
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Header & Progress --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: linear-gradient(180deg, rgba(5,5,16,0.9) 0%, rgba(5,5,16,0) 100%);
            z-index: 10;
        }

        #progress-text {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--neon-cyan);
            text-shadow: 0 0 8px rgba(6, 182, 212, 0.7);
            letter-spacing: 2px;
        }

        #settings-btn {
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px;
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink);
            transition: transform 0.2s;
        }

        #settings-btn:active {
            transform: rotate(45deg);
        }

        #progress-bar-container {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
        }

        #progress-bar {
            height: 100%;
            width: 0%;
            background: var(--neon-purple);
            box-shadow: 0 0 10px var(--neon-purple), 0 0 20px var(--neon-pink);
            transition: width 0.3s ease;
        }
