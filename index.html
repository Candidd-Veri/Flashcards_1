<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <meta name="theme-color" content="#050510">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Tech+ PWA Flashcards</title>
    <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23050510' stroke='%23d946ef' stroke-width='4'/><text x='50' y='68' font-size='50' text-anchor='middle' fill='%2306b6d4' font-family='sans-serif' font-weight='bold'>T+</text></svg>">
    
    <style>
        :root {
            --neon-pink: #d946ef;
            --neon-purple: #a855f7;
            --neon-cyan: #06b6d4;
            --neon-blue: #3b82f6;
            --bg-color: #050510;
            --card-bg: rgba(20, 20, 40, 0.6);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            box-sizing: border-box;
            user-select: none; /* Mobile app feel */
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Header & Progress --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: linear-gradient(180deg, rgba(5,5,16,0.9) 0%, rgba(5,5,16,0) 100%);
            z-index: 10;
        }

        #progress-text {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--neon-cyan);
            text-shadow: 0 0 8px rgba(6, 182, 212, 0.7);
            letter-spacing: 2px;
        }

        #settings-btn {
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px;
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink);
            transition: transform 0.2s;
        }

        #settings-btn:active {
            transform: rotate(45deg);
        }

        #progress-bar-container {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
        }

        #progress-bar {
            height: 100%;
            width: 0%;
            background: var(--neon-purple);
            box-shadow: 0 0 10px var(--neon-purple), 0 0 20px var(--neon-pink);
            transition: width 0.3s ease;
        }

        /* --- Main Card Area --- */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
        }

        #empty-state {
            display: none;
            text-align: center;
            padding: 30px;
            font-size: 1.4rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-blue);
            border: 1px solid var(--neon-cyan);
            border-radius: 15px;
            background: var(--card-bg);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.2) inset;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 2.5rem;
            padding: 15px;
            cursor: pointer;
            z-index: 5;
            transition: color 0.2s, text-shadow 0.2s;
        }
        
        .nav-btn:active {
            color: var(--neon-cyan);
            text-shadow: 0 0 15px var(--neon-cyan);
        }

        #card-container {
            flex: 1;
            max-width: 400px;
            height: 60vh;
            perspective: 1000px;
            margin: 0 10px;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
            -webkit-transform-style: preserve-3d;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 0 20px rgba(0,0,0,0.5), inset 0 0 15px rgba(255,255,255,0.05);
        }

        .card-front {
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4), inset 0 0 10px rgba(6, 182, 212, 0.2);
            transform: rotateY(0deg);
            translateZ(1px);
        }

        .card-back {
            border: 1px solid var(--neon-pink);
            box-shadow: 0 0 15px rgba(217, 70, 239, 0.4), inset 0 0 10px rgba(217, 70, 239, 0.2);
            transform: rotateY(180deg);
            translateZ(1px);
        }

        .card-domain {
            position: absolute;
            top: 20px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
        }

        .card-content {
            font-size: 1.6rem;
            font-weight: 600;
            line-height: 1.4;
        }
        .card-back .card-content {
            font-size: 1.3rem;
            font-weight: 400;
        }

        /* --- Rating Area --- */
        #rating-area {
            display: flex;
            justify-content: space-around;
            padding: 20px 10px 40px;
            background: linear-gradient(0deg, rgba(5,5,16,1) 40%, rgba(5,5,16,0) 100%);
        }

        .rating-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            width: 70px;
            height: 70px;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .rating-btn span {
            font-size: 0.6rem;
            margin-top: 5px;
            color: var(--text-dim);
            font-weight: bold;
            text-transform: uppercase;
        }

        .rating-btn:active {
            transform: scale(0.9);
        }

        .rating-btn.active[data-val="known"] {
            border-color: #22c55e;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.6);
            transform: scale(1.1);
        }
        .rating-btn.active[data-val="unsure"] {
            border-color: #eab308;
            box-shadow: 0 0 20px rgba(234, 179, 8, 0.6);
            transform: scale(1.1);
        }
        .rating-btn.active[data-val="unknown"] {
            border-color: #ef4444;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
            transform: scale(1.1);
        }

        /* --- Settings Modal --- */
        #settings-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: flex;
            align-items: flex-end;
            opacity: 1;
            transition: opacity 0.3s;
        }

        #settings-modal.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .modal-content {
            background: var(--bg-color);
            width: 100%;
            max-height: 90vh;
            border-top: 2px solid var(--neon-purple);
            box-shadow: 0 -10px 30px rgba(168, 85, 247, 0.3);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 30px 20px;
            overflow-y: auto;
            transform: translateY(0);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #settings-modal.hidden .modal-content {
            transform: translateY(100%);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: var(--neon-pink);
            text-shadow: 0 0 10px rgba(217, 70, 239, 0.5);
        }

        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .setting-group {
            margin-bottom: 25px;
        }

        .setting-group label {
            display: block;
            margin-bottom: 10px;
            color: var(--neon-cyan);
            font-weight: 600;
            letter-spacing: 1px;
        }

        select, .btn {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--neon-purple);
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 10px;
            outline: none;
        }
        
        select option {
            background: var(--bg-color);
        }

        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255,255,255,0.2);
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 20px; width: 20px;
            left: 4px; bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
        }
        input:checked + .slider:before {
            transform: translateX(22px);
        }

        .btn {
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            transition: 0.2s;
        }
        .btn-shuffle {
            background: rgba(6, 182, 212, 0.2);
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.2);
        }
        .btn-shuffle:active { background: var(--neon-cyan); color: #000; }
        
        .btn-danger {
            background: rgba(239, 68, 68, 0.2);
            border-color: #ef4444;
            color: #ef4444;
        }
        .btn-danger:active { background: #ef4444; color: #fff; }

    </style>
</head>

    <main>

        <button class="nav-btn" id="next-btn">▶</button>

    <div id="rating-area">

    <div id="settings-modal" class="hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>SYSTEM CONFIG</h2>
                <button class="close-btn" id="close-settings">✖</button>

            <div class="setting-group">

                    <option value="term">Term on Front</option>

            <div class="setting-group">
                <label>Filter by Domain</label>
                <select id="setting-domain">
                    <option value="all">All Domains (1.0 - 6.0)</option>
                    <option value="1.0">Domain 1.0: IT Concepts</option>
                    <option value="2.0">Domain 2.0: Infrastructure</option>
                    <option value="3.0">Domain 3.0: Applications</option>
                    <option value="4.0">Domain 4.0: Software Dev</option>
                    <option value="5.0">Domain 5.0: Database</option>
                    <option value="6.0">Domain 6.0: Security</option>
                </select>
            </div>

            <div class="setting-group">
                <div class="toggle-container">
                    <span>Omit "Know It" Cards</span>
                    <label class="switch">
                        <input type="checkbox" id="setting-omit">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="setting-group">
                <button class="btn btn-shuffle" id="btn-shuffle">🔀 Shuffle Deck</button>
                <button class="btn btn-danger" id="btn-reset">⚠️ Reset All Ratings</button>
            </div>
        </div>
    </div>

// --- App State ---
let filteredDeck = [];

// DOM Elements

const elProgressBar = document.getElementById('progress-bar');

const elBackContent = document.getElementById('back-content');

const elNextBtn = document.getElementById('next-btn');

// Settings Inputs
const setDisplay = document.getElementById('setting-display');
const setDomain = document.getElementById('setting-domain');
const setOmit = document.getElementById('setting-omit');
const btnShuffle = document.getElementById('btn-shuffle');
const btnReset = document.getElementById('btn-reset');

// Load settings from storage or defaults
let appSettings = JSON.parse(localStorage.getItem('techplus_settings')) || {
    displayMode: 'term',
    domainFilter: 'all',
    omitKnown: false
};

// Initialize Settings UI
setDisplay.value = appSettings.displayMode;
setDomain.value = appSettings.domainFilter;
setOmit.checked = appSettings.omitKnown;

// --- Core Logic ---

// Shuffle Array (Fisher-Yates)
function shuffle(array) {
    let curId = array.length;
    while (0 !== curId) {
        let randId = Math.floor(Math.random() * curId);
        curId -= 1;
        let tmp = array[curId];
        array[curId] = array[randId];
        array[randId] = tmp;
    }
    return array;
}

// Build the deck based on filters
function buildDeck() {
    let temp = masterDeck.filter(card => {
        // Domain Filter
        if (appSettings.domainFilter !== 'all' && card.domain !== appSettings.domainFilter) return false;
        // Mastery Filter
        if (appSettings.omitKnown && ratings[card.id] === 'known') return false;
        return true;
    });
    filteredDeck = shuffle(temp);
    currentIndex = 0;
    renderCard();
}

// Render the current card and progress
function renderCard() {
    if (filteredDeck.length === 0) {
        elCardContainer.style.display = 'none';
        elEmptyState.style.display = 'block';
        elProgressText.innerText = "0 / 0";
        elProgressBar.style.width = "0%";
        updateRatingUI(null);
        return;
    }

    elCardContainer.style.display = 'block';
    elEmptyState.style.display = 'none';
    elCard.classList.remove('flipped'); // Reset flip state

    const card = filteredDeck[currentIndex];
    
    // Determine Front/Back based on setting
    let frontText = card.term;
    let backText = card.definition;
    
    if (appSettings.displayMode === 'def') {
        frontText = card.definition;
        backText = card.term;
    } else if (appSettings.displayMode === 'random') {
        if (Math.random() > 0.5) {
            frontText = card.definition;
            backText = card.term;
        }
    }

    // Small delay to allow unflip animation to complete before text swap if needed
    setTimeout(() => {
        elFrontDomain.innerText = `Domain ${card.domain}`;
        elFrontContent.innerText = frontText;
        elBackDomain.innerText = `Domain ${card.domain}`;
        elBackContent.innerText = backText;
    }, 150); 

    // Update Progress
    elProgressText.innerText = `${currentIndex + 1} / ${filteredDeck.length}`;
    const pct = ((currentIndex + 1) / filteredDeck.length) * 100;
    elProgressBar.style.width = `${pct}%`;

    // Update Rating UI
    updateRatingUI(card.id);
}

function updateRatingUI(cardId) {
    ratingBtns.forEach(btn => btn.classList.remove('active'));
    if (!cardId) return;
    const currentRating = ratings[cardId];
    if (currentRating) {
        const btn = document.querySelector(`.rating-btn[data-val="${currentRating}"]`);
        if (btn) btn.classList.add('active');
    }
}

// Navigation
function nextCard() {
    if (filteredDeck.length === 0) return;
    currentIndex = (currentIndex + 1) % filteredDeck.length;
    renderCard();
}

function prevCard() {
    if (filteredDeck.length === 0) return;
    currentIndex = (currentIndex - 1 + filteredDeck.length) % filteredDeck.length;
    renderCard();
}

// --- Event Listeners ---

// Card Flip
elCard.addEventListener('click', () => {
    elCard.classList.toggle('flipped');
});

// Controls
elNextBtn.addEventListener('click', nextCard);
elPrevBtn.addEventListener('click', prevCard);

// Swipe Gestures
let startX = 0;
let endX = 0;
elCardContainer.addEventListener('touchstart', e => {
    startX = e.changedTouches[0].screenX;
});
elCardContainer.addEventListener('touchend', e => {
    endX = e.changedTouches[0].screenX;
    if (startX - endX > 50) nextCard(); // Swipe left -> Next
    if (endX - startX > 50) prevCard(); // Swipe right -> Prev
});

// Ratings
ratingBtns.forEach(btn => {
    btn.addEventListener('click', (e) => {
        if (filteredDeck.length === 0) return;
        const val = e.currentTarget.getAttribute('data-val');
        const cardId = filteredDeck[currentIndex].id;
        
        ratings[cardId] = val;
        localStorage.setItem('techplus_ratings', JSON.stringify(ratings));
        updateRatingUI(cardId);
    });
});

// Settings Modal
elSettingsBtn.addEventListener('click', () => elModal.classList.remove('hidden'));
elCloseSettings.addEventListener('click', () => elModal.classList.add('hidden'));

// Save Settings and Rebuild
function saveSettings() {
    appSettings = {
        displayMode: setDisplay.value,
        domainFilter: setDomain.value,
        omitKnown: setOmit.checked
    };
    localStorage.setItem('techplus_settings', JSON.stringify(appSettings));
    buildDeck();
}

setDisplay.addEventListener('change', saveSettings);
setDomain.addEventListener('change', saveSettings);
setOmit.addEventListener('change', saveSettings);

// Actions
btnShuffle.addEventListener('click', () => {
    filteredDeck = shuffle(filteredDeck);
    currentIndex = 0;
    renderCard();
    elModal.classList.add('hidden');
});

btnReset.addEventListener('click', () => {
    if(confirm("Are you sure you want to reset all your mastery ratings? This cannot be undone.")) {
        ratings = {};
        localStorage.removeItem('techplus_ratings');
        buildDeck();
        elModal.classList.add('hidden');
    }
});

// Init
buildDeck();

</script>
</body>
</html>
